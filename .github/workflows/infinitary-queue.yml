# Infinitary queue 12. Generated by Infinitary from one source; a newer Infinitary offers its update as a pull request, so change it there, not by hand.
name: Infinitary queue

# The shipped fix-forward queue (docs/forge.md in Infinitary, "The shipped
# queue"). An approver's merge click in Infinitary marks the approved version
# with the commit status infinitary/queue, pending. This workflow gathers
# every change so marked, composes them onto the default branch, runs the
# project's batch checks (.github/workflows/infinitary-batch-checks.yml, the
# one file of the queue the project writes itself) and writes the verdict:
# green passes every change, then the isolated merge job merges it.
# Red first confirms: the batch checks run once more on the same batch, told
# the failed jobs and the failed test files, and run only what the project's
# file chooses for them. A green confirm passes every change; a red one, or a
# failure whose log named no test file, pauses every change behind one issue
# and blames no change. A change labelled infinitary-queue-fix after the
# pause began ends it once it is approved; a by-hand resume or send-back,
# from Infinitary or this workflow's Run workflow button, ends it too.
# Someone with write access may queue a change without Infinitary by putting
# the label infinitary-queue on it: the label job queues the version the
# label went on and takes the label off, so a later push leaves the queue
# until the label goes on again.

on:
  # Infinitary's approval mark. Any other status starts a run that does nothing.
  status:
  # The queue label. This event runs this file as the default branch has it,
  # with this file's write access, even on a fork's pull request: the label
  # job reads the pull request through GitHub's API and never checks out or
  # runs its code.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: form starts the next batch; resume ends a pause; send-back sends one change back and resumes the rest
        type: choice
        options: [form, resume, send-back]
        default: form
      number:
        description: The pull request a send-back sends back
        type: string
        default: ""
      reason:
        description: Why the queue may go on (resume and send-back)
        type: string
        default: ""

# One batch at a time: a send-back ends an already-failed run; otherwise
# GitHub keeps the running batch and the newest waiting start. Every start
# reads the queue again, so a dropped start loses nothing. Other statuses
# and answers stay out of that line.
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('infinitary-queue-label-{0}', github.run_id) || github.event_name == 'status' && github.event.context != 'infinitary/queue' && format('infinitary-queue-other-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.action != 'form' && format('infinitary-queue-answer-{0}', github.run_id) || 'infinitary-queue' }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: read
  actions: write

jobs:
  answer:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'form'
    name: Answer the pause
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/infinitary
      - uses: actions/github-script@v7
        env:
          ACTION: ${{ inputs.action }}
          NUMBER: ${{ inputs.number }}
          REASON: ${{ inputs.reason }}
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.answer({github, context, core, action: process.env.ACTION, number: process.env.NUMBER, reason: process.env.REASON});

  # Only the default branch's own files are checked out here, never the
  # pull request's: this job holds a write key on any pull request.
  label:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'infinitary-queue'
    name: Queue by label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/infinitary
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.labelled({github, context, core});

  form:
    if: (github.event_name == 'status' && github.event.context == 'infinitary/queue' && github.event.state == 'pending') || (github.event_name == 'workflow_dispatch' && inputs.action == 'form')
    name: Form the batch
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.mark.outputs.run }}
      base: ${{ steps.mark.outputs.base }}
      tree: ${{ steps.mark.outputs.tree }}
      heads: ${{ steps.mark.outputs.heads }}
      members: ${{ steps.mark.outputs.members }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: form
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.form({github, context, core});
      # Composes onto the default branch fetched again here, after the form
      # step read the queue: a change that merged since the checkout above
      # is no longer open, so only this base carries it.
      - id: compose
        if: steps.form.outputs.heads != ''
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          HEADS: ${{ steps.form.outputs.heads }}
        run: |
          bash .github/actions/infinitary-batch/compose.sh compose "$BRANCH" $HEADS | tee "$RUNNER_TEMP/composition"
      - id: mark
        if: steps.form.outputs.heads != ''
        uses: actions/github-script@v7
        env:
          MEMBERS: ${{ steps.form.outputs.members }}
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.mark({github, context, core,
              output: fs.readFileSync(`${process.env.RUNNER_TEMP}/composition`, 'utf8'),
              members: JSON.parse(process.env.MEMBERS)});

  # The batch's own code runs here, so as shipped it gets only a read of the
  # project: no status, issue or run writes and no secret, so nothing in a
  # batch can mark itself passed. The team's grants, here and the same in the
  # confirm job, are the one part of this file a project edits, and an update
  # keeps them: a secret a check needs,
  # named in the queue's setup, is passed here by name (and declared under
  # workflow_call secrets in the batch checks file), and a write a check
  # needs, named there too, is added under permissions. GitHub hands a
  # called workflow only the secrets its caller passes, so nothing else
  # reaches the batch, not even an environment's.
  checks:
    needs: form
    if: needs.form.outputs.run == 'true'
    name: Batch checks
    uses: ./.github/workflows/infinitary-batch-checks.yml
    permissions:
      contents: read
      # The team's grants: a write the queue's setup named, such as
      # packages: write.
    # secrets:
    #   NAME: ${{ secrets.NAME }}
    with:
      batch: ${{ needs.form.outputs.heads }}
      base: ${{ needs.form.outputs.base }}
      tree: ${{ needs.form.outputs.tree }}

  # After red batch checks: the failed jobs and the test files their logs
  # named as failed, which the confirm runs again. Both stay empty when a
  # failed job's log named no test file: then nothing runs again.
  failures:
    needs: [form, checks]
    if: ${{ !cancelled() && needs.form.outputs.run == 'true' && needs.checks.result == 'failure' }}
    name: Read the failures
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.read.outputs.jobs }}
      files: ${{ steps.read.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/infinitary
      - id: read
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.failures({github, context, core});

  # The confirm: the same batch checks on the same composed batch, told
  # failed_jobs (the failed jobs' names below this run's Batch checks, one a
  # line) and failed_files (the failed test files, separated by spaces). The
  # batch checks file decides what they run: only the failed jobs, or only
  # the failed files, and every other job skips itself. Its grants are the
  # checks job's, the same in both.
  confirm:
    needs: [form, failures]
    if: ${{ !cancelled() && needs.failures.outputs.jobs != '' }}
    name: Batch confirm
    uses: ./.github/workflows/infinitary-batch-checks.yml
    permissions:
      contents: read
      # The team's grants: a write the queue's setup named, such as
      # packages: write.
    # secrets:
    #   NAME: ${{ secrets.NAME }}
    with:
      batch: ${{ needs.form.outputs.heads }}
      base: ${{ needs.form.outputs.base }}
      tree: ${{ needs.form.outputs.tree }}
      failed_jobs: ${{ needs.failures.outputs.jobs }}
      failed_files: ${{ needs.failures.outputs.files }}

  verdict:
    needs: [form, checks, failures, confirm]
    if: ${{ !cancelled() && needs.form.outputs.run == 'true' }}
    name: Batch verdict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/infinitary
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.checks.result }}
          CONFIRM: ${{ needs.confirm.result }}
          TREE: ${{ needs.form.outputs.tree }}
          MEMBERS: ${{ needs.form.outputs.members }}
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.decide({github, context, core, result: process.env.RESULT,
              confirm: process.env.CONFIRM,
              members: JSON.parse(process.env.MEMBERS), tree: process.env.TREE});

  # No batch code runs here. Only this job may write code or merge a pull request.
  merge:
    needs: [form, verdict]
    if: ${{ !cancelled() && needs.form.result == 'success' }}
    name: Merge passed changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/infinitary
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const queue = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/infinitary/github.mjs`).href);
            await queue.mergePassed({github, context, core});
